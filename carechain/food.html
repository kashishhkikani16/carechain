<!DOCTYPE html>
<html>

<head>

    <title>CareChain - Food Request</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav>

        <h2>CareChain</h2>

        <div>

            <a href="index.html">Home</a>
            <a href="resources.html">Resources</a>
            <a href="track.html">Track</a>
            <a href="about.html">About</a>

        </div>

    <section class="request-section">

        <h1>Food Request</h1>

        <p>
            Enter your details and select the food item and quantity.
        </p>


        <form action="php/food.php" method="post">


            <label>Your Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >


            <label>Mobile Number</label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter your 10 digit mobile number"
                maxlength="10"
                pattern="[0-9]{10}"
                required
            >


            <label>Delivery Address</label>

            <textarea
                name="address"
                placeholder="Enter your complete delivery address"
                rows="4"
                required
            ></textarea>


            <label>Pincode</label>

            <input
                type="text"
                name="pincode"
                placeholder="Enter 6 digit pincode"
                maxlength="6"
                pattern="[0-9]{6}"
                required
            >


            <label>Food Item</label>

            <select name="food" required>

                <option value="">Select Food Item</option>

                <option value="Wheat (Gau / Gehun)">
                    Wheat (Gau / Gehun)
                </option>

                <option value="Rice (Chokha / Chawal)">
                    Rice (Chokha / Chawal)
                </option>

                <option value="Pearl Millet (Bajri / Bajra)">
                    Pearl Millet (Bajri / Bajra)
                </option>

                <option value="Sorghum (Jowar)">
                    Sorghum (Jowar)
                </option>

                <option value="Finger Millet (Nachni / Ragi)">
                    Finger Millet (Nachni / Ragi)
                </option>

                <option value="Maize / Corn (Makai / Makka)">
                    Maize / Corn (Makai / Makka)
                </option>

                <option value="Oats">
                    Oats
                </option>

                <option value="Barley (Jau)">
                    Barley (Jau)
                </option>

                <option value="Chickpeas / Garbanzo Beans (Chana / Chole)">
                    Chickpeas / Garbanzo Beans (Chana / Chole)
                </option>

                <option value="Pigeon Peas (Tuver / Arhar Dal)">
                    Pigeon Peas (Tuver / Arhar Dal)
                </option>

                <option value="Green Gram (Moong)">
                    Green Gram (Moong)
                </option>

                <option value="Black Gram (Udad / Urad)">
                    Black Gram (Udad / Urad)
                </option>

                <option value="Red Lentils (Masoor)">
                    Red Lentils (Masoor)
                </option>

                <option value="Kidney Beans (Rajma)">
                    Kidney Beans (Rajma)
                </option>

                <option value="Black Eyed Peas (Chora / Lobia)">
                    Black Eyed Peas (Chora / Lobia)
                </option>

                <option value="Green / White Peas (Vatana / Matar)">
                    Green / White Peas (Vatana / Matar)
                </option>

                <option value="Clarified Butter (Ghee)">
                    Clarified Butter (Ghee)
                </option>

                <option value="Groundnut / Peanut Oil (Sing Tel / Moongfali Ka Tel)">
                    Groundnut / Peanut Oil (Sing Tel / Moongfali Ka Tel)
                </option>

                <option value="Mustard Oil (Rai Nu Tel / Sarso Ka Tel)">
                    Mustard Oil (Rai Nu Tel / Sarso Ka Tel)
                </option>

                <option value="Sunflower Oil (Surajmukhi Nu Tel)">
                    Sunflower Oil (Surajmukhi Nu Tel)
                </option>

                <option value="Sesame Oil (Til Nu Tel)">
                    Sesame Oil (Til Nu Tel)
                </option>

                <option value="Coconut Oil (Nariyal Nu Tel)">
                    Coconut Oil (Nariyal Nu Tel)
                </option>

                <option value="Olive Oil (Olive Tel)">
                    Olive Oil (Olive Tel)
                </option>

            </select>


            <label>Quantity</label>

            <select name="quantity" required>

                <option value="">Select Quantity</option>

                <option value="1 KG">1 KG</option>

                <option value="2 KG">2 KG</option>

                <option value="5 KG">5 KG</option>

            </select>


            <br><br>


            <br><br>


<a href="resources.html">

    <button type="button">
        Back
    </button>

</a>


<button type="submit">
    Submit Food Request
</button>


        </form>

    </section>

</body>

</html>
